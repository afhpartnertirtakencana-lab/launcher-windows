name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang platform Android 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --console=plain --stacktrace > build.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            msg=$(grep -E "^e: |^\* What went wrong|^Execution failed|^> |error:|AAPT|Manifest merger" build.log \
              | sed -e 's#file:///home/runner/work/[^/]*/[^/]*/##' -e 's/%/%25/g' \
              | head -40 | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle gagal::${msg}"
          fi
          exit "$code"

      - name: Simpan log build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WinLauncher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
